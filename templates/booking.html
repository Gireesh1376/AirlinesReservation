{% extends 'base.html' %}
{% block content %}

<h2 class="text-center mb-4">Book Flight {{ flight.flight_no }}</h2>

<form action="{{ url_for('app_views.payment') }}" method="POST" style="text-align:center;">

    <!-- Hidden: Flight ID -->
    <input type="hidden" name="flight_id" value="{{ flight.id }}">

    <!-- Hidden: Selected Seat -->
    <input type="hidden" name="seat_number" value="{{ seat_number }}">

    <!-- Hidden: Auto-selected Seat Class -->
    <input type="hidden" id="auto_class" name="seat_class" value="{{ seat_class }}">

    <!-- Hidden: Final Price -->
    <input type="hidden" name="final_price" value="{{ final_price }}">

    <h3 class="mt-3">Seat Selected: <b>{{ seat_number }}</b></h3>

    <p class="text-muted">
        <b>Seat Class:</b> {{ seat_class }} <br>
        <b>Price:</b> ₹{{ final_price }}
    </p>

    <br>

    <!-- REMOVE NAME/EMAIL FIELDS - They are handled via session -->
    <p><b>Passenger:</b> {{ session.user_name }}</p>
    <p><b>Email:</b> {{ session.user_email }}</p>


    <button type="submit" class="btn btn-primary">Proceed to Payment</button>
</form>

{% endblock %}
