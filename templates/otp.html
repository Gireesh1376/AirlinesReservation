{% extends 'base.html' %}
{% block content %}

<h2 class="text-center mb-4">Enter OTP</h2>

<p class="text-center">OTP sent to your bank registered mobile: <b>123456</b></p>

<form action="/finish_payment" method="POST">
    
    <input type="hidden" name="flight_id" value="{{ flight_id }}">
    <input type="hidden" name="seat_class" value="{{ seat_class }}">
    <input type="hidden" name="seat_number" value="{{ seat_number }}">
    <input type="hidden" name="final_price" value="{{ final_price }}">

    <label>Enter OTP</label>
    <input type="text" name="otp" class="form-control" required>

    <button class="btn btn-primary mt-3">Confirm Payment</button>
</form>

{% endblock %}
